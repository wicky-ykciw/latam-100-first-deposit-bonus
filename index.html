our position","remaining":"Margin remaining","shortfall":"Margin shortfall","capacity":"Margin-supported size","unit":"lots","assumptions":"Illustrative XAUUSD price: USD 3,739.31/oz. Contract: 100 oz per lot. Fixed leverage: 1:1,000. This is an example, not a live price.","caution":"Assumes no open positions, spread, fees or losses. Credit bonus cannot cover losses or costs. Actual leverage and requirements vary; leverage may adjust above USD 5,000 equity. Margin-supported size is theoretical, not a recommended trade size.","invalid":"Enter a deposit of at least USD 100 and a positive position size in 0.01-lot increments. Later deposits cannot top up an ineligible first deposit.","limitNote":"Credit bonus capped at USD 1,000. Illustration assumes an approved application.","high":"Illustrated equity exceeds USD 5,000. Actual leverage may be reduced; the fixed-leverage comparison is not an executable quote."},"pt":{"lang":"pt-BR","locale":"pt-BR","nav":"Como participar","faqNav":"Dúvidas","hero":"Bônus de 100%<br>no primeiro depósito","sub":"Comece com US$ 100. Receba 100% de bônus em crédito no primeiro depósito, até US$ 1.000.","cta":"Participe agora","micro":"Solicite a adesão ao seu gerente de conta. Bônus em crédito não sacável, exclusivo para margem. Aplicam-se os termos e condições.","period":"1º de janeiro a 31 de março de 2027 · Horário do servidor MT4/MT5","calcTitle":"Veja a diferença na sua margem.","calcBody":"Insira seu depósito e o tamanho da posição em ouro. Compare a mesma posição com e sem bônus em crédito.","depositLabel":"Seu primeiro depósito (USD)","howTitle":"Seu primeiro bônus, em quatro passos.","steps":[["Abra sua conta","Cadastre-se e conclua a verificação de uma conta MT4/MT5 elegível."],["Faça seu primeiro depósito","Deposite pelo menos US$ 100 durante a campanha."],["Fale com seu gerente de conta","Solicite a adesão manual antes do fim da campanha. O depósito não gera adesão automática."],["Aceite e receba","Após a análise, aceite os termos no Portal do Cliente. O bônus costuma chegar em um dia útil, mas pode levar até sete."]],"faqTitle":"Suas dúvidas, respondidas.","faqs":[["Quem pode participar?","Novos clientes e clientes cadastrados que nunca depositaram em nenhuma conta TMGM, com residência cadastrada no Brasil ou no México. É necessário usar uma conta MT4/MT5 elegível e cumprir os requisitos de abertura. Uma participação por cliente, em uma conta. Clientes ASIC não podem participar."],["Quanto posso receber de bônus em crédito?","Receba 100% do primeiro depósito externo elegível a partir de US$ 100, limitado a US$ 1.000 em bônus em crédito. Depósitos posteriores não podem complementar um primeiro depósito inelegível. Sujeito à aprovação e aos limites da conta."],["Posso sacar meu bônus em crédito?","Não. O bônus em crédito não é sacável e só pode ser usado como margem. Não cobre perdas nem custos. Saques ou transferências de saída podem reduzir o bônus conforme os termos."],["Qual é a validade do bônus em crédito?","O bônus em crédito expira dois anos após o recebimento. Pode ser reduzido ou removido antes conforme os termos, inclusive por saques, inatividade ou uso indevido."]],"risk":"Forex e CFDs envolvem alto risco. Você pode perder todo o seu capital, e as perdas podem superar seu depósito. O bônus em crédito não cobre perdas nem custos. Se o patrimônio ficar abaixo do crédito, haverá stop-out mesmo acima do limite normal de margem. Leia os termos completos antes de operar.","terms":"Detalhes da promoção","legal":"Trademax Global Limited · VFSC 40356. Informações gerais, sem caráter de aconselhamento financeiro pessoal. Considere seus objetivos, sua situação financeira e suas necessidades. Leia o Contrato do Cliente e a Divulgação de Riscos antes de operar.","detailsBody":"De 1º de janeiro de 2027 às 00:00:00 a 31 de março de 2027 às 23:59:59, horário do servidor MT4/MT5. Para residentes cadastrados no Brasil e no México que nunca depositaram na TMGM. Primeiro depósito externo mínimo de  del 100%<br>en tu primer depósito","sub":"Empieza con USD 100. Recibe un bono de crédito del 100% en tu primer depósito, hasta USD 1,000.","cta":"Únete ahora","micro":"Solicita tu participación a través de tu ejecutivo de cuenta. Bono de crédito no retirable, exclusivo para margen. Aplican términos y condiciones.","period":"Del 1 de enero al 31 de marzo de 2027 · Hora del servidor MT4/MT5","calcTitle":"Descubre la diferencia en tu margen.","calcBody":"Ingresa tu depósito y el tamaño de tu posición en oro. Compara la misma posición con y sin bono de crédito.","depositLabel":"Tu primer depósito (USD)","howTitle":"Tu primer bono, en cuatro pasos.","steps":[["Abre tu cuenta","Regístrate y completa la verificación de una cuenta MT4/MT5 elegible."],["Haz tu primer depósito","Deposita al menos USD 100 durante la campaña."],["Habla con tu ejecutivo de cuenta","Solicita tu participación manual antes de que termine la campaña. Depositar no te inscribe automáticamente."],["Acepta y recibe","Después de la revisión, acepta los términos en el Portal del Cliente. El bono suele llegar en un día hábil, pero puede tardar hasta siete."]],"faqTitle":"Resolvemos tus dudas.","faqs":[["¿Quién puede participar?","Clientes nuevos y registrados que nunca hayan depositado en ninguna cuenta TMGM, con residencia registrada en Brasil o México. Necesitas una cuenta MT4/MT5 elegible y cumplir los requisitos de apertura. Una participación por cliente, en una cuenta. Los clientes ASIC están excluidos."],["¿Cuánto bono de crédito puedo recibir?","Recibe el 100% de tu primer depósito externo elegible de al menos USD 100, hasta USD 1,000 en bono de crédito. Los depósitos posteriores no pueden completar un primer depósito no elegible. Sujeto a aprobación y límites de la cuenta."],["¿Puedo retirar mi bono de crédito?","No. El bono de crédito no es retirable y solo puede utilizarse como margen. No cubre pérdidas ni costos. Los retiros o transferencias de salida pueden reducir el bono según los términos."
